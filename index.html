  <script>
    // Restore route redirected from 404.html on GitHub Pages
    (function() {
      const params = new URLSearchParams(window.location.search);
      const redirectRoute = params.get('route');
      if (redirectRoute) {
        params.delete('route');
        const cleanSearch = params.toString() ? '?' + params.toString() : '';
        const segments = window.location.pathname.split('/').filter(Boolean);
        const knownRoutes = new Set([
          'programs', 'certifications', 'compare', 'admissions', 'placements',
          'campus', 'about', 'resources', 'parents', 'visit', 'contact', 'apply', 'track'
        ]);
        let base = '';
        if (segments.length > 0 && !knownRoutes.has(segments[0])) {
          base = '/' + segments[0];
        }
        const target = (base || '') + (redirectRoute.startsWith('/') ? redirectRoute : '/' + redirectRoute) + cleanSearch + window.location.hash;
        window.history.replaceState(null, '', target);
      }
    })();
  </script>
